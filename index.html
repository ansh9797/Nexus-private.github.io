<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexus | Private</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
body{margin:0;background:#000;color:#fff;font-family:-apple-system}
.hidden{display:none}
#chat{max-width:500px;margin:auto;height:100vh;display:flex;flex-direction:column}
header{padding:12px;background:#111;border-bottom:1px solid #222}
.name{font-weight:bold;cursor:pointer}
.status{font-size:12px;color:#aaa}
#messages{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px;border-radius:16px;position:relative}
.sent{align-self:flex-end;background:#3797f0}
.recv{align-self:flex-start;background:#262626}
.reply-box{background:rgba(0,0,0,.25);padding:6px;border-left:3px solid #fff;border-radius:6px;margin-bottom:6px;font-size:12px}
.tick{font-size:11px;opacity:.7;text-align:right;margin-top:2px}
.input-bar{background:#111;padding:10px}
.reply-preview{background:#1a1a1a;padding:8px;border-left:3px solid #3797f0;border-radius:6px;font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
.row{display:flex;gap:10px}
input{flex:1;padding:10px;border-radius:20px;border:none}
button{background:none;border:none;color:#3797f0;font-weight:bold;cursor:pointer}
.typing{font-size:12px;color:#aaa;padding:6px 15px}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<input id="phone" placeholder="+91...">
<button onclick="sendOTP()">Send OTP</button>
<div id="otpBox" class="hidden">
<input id="otp">
<button onclick="verifyOTP()">Login</button>
</div>
<div id="recaptcha"></div>
</div>

<!-- CHAT -->
<div id="chat" class="hidden">
<header>
<div class="name" id="chatName" onclick="setNickname()"></div>
<div class="status" id="status"></div>
</header>

<div class="typing hidden" id="typing">typing…</div>
<div id="messages"></div>

<div class="input-bar">
<div id="replyPreview" class="reply-preview hidden">
<span id="replyText"></span>
<span onclick="cancelReply()">✕</span>
</div>
<div class="row">
<input id="msgIn" placeholder="Message" oninput="typingNow()">
<button onclick="sendText()">Send</button>
</div>
</div>
</div>

<script>
/* CONFIG */
firebase.initializeApp({
apiKey:"AIzaSyATZocEXlzKYosr5EDrXWC2llBhlWGCAtE",
authDomain:"nexus-private.firebaseapp.com",
projectId:"nexus-private"
});

const auth=firebase.auth();
const db=firebase.firestore();
const KEY="Secretamongus";

/* FIXED USERS */
const ME="+918480894259";
const HER="+918260368337";
const ROOM=[ME,HER].sort().join("_");

let replyData=null;
let typingTimer;

/* AUTH */
window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha',{size:'invisible'});

function sendOTP(){
auth.signInWithPhoneNumber(phone.value,recaptchaVerifier)
.then(r=>{window.cr=r;otpBox.classList.remove('hidden')});
}
function verifyOTP(){cr.confirm(otp.value)}

auth.onAuthStateChanged(u=>{
if(!u) return;

if(u.phoneNumber!==ME && u.phoneNumber!==HER){
alert("Not authorized");
auth.signOut();
return;
}

auth.remove();
chat.classList.remove('hidden');

loadNickname();
setPresence();
listenPresence();
listenTyping();
listenMessages();
});

/* 🔤 NICKNAME SYSTEM */
function otherUser(){
return auth.currentUser.phoneNumber===ME?HER:ME;
}

function defaultName(){
return auth.currentUser.phoneNumber===ME?"Her":"Him";
}

function loadNickname(){
db.collection("nicknames")
.doc(auth.currentUser.phoneNumber)
.collection("names")
.doc(otherUser())
.onSnapshot(d=>{
chatName.textContent=d.exists?d.data().name:defaultName();
});
}

function setNickname(){
const name=prompt("Set nickname");
if(!name) return;
db.collection("nicknames")
.doc(auth.currentUser.phoneNumber)
.collection("names")
.doc(otherUser())
.set({name});
}

/* PRESENCE */
function setPresence(){
const ref=db.collection("presence").doc(auth.currentUser.phoneNumber);
ref.set({online:true,last:Date.now()});
window.addEventListener("beforeunload",()=>ref.set({online:false,last:Date.now()}));
}

function listenPresence(){
db.collection("presence").onSnapshot(s=>{
s.forEach(d=>{
if(d.id!==auth.currentUser.phoneNumber){
const p=d.data();
status.textContent=p.online?"Online":"Last seen "+new Date(p.last).toLocaleTimeString();
}
});
});
}

/* TYPING */
function typingNow(){
db.collection("typing").doc(ROOM).set({user:auth.currentUser.phoneNumber});
clearTimeout(typingTimer);
typingTimer=setTimeout(()=>db.collection("typing").doc(ROOM).delete(),1200);
}
function listenTyping(){
db.collection("typing").doc(ROOM).onSnapshot(d=>{
if(!d.exists||d.data().user===auth.currentUser.phoneNumber)
typing.classList.add("hidden");
else typing.classList.remove("hidden");
});
}

/* SEND MESSAGE */
function sendText(){
if(!msgIn.value) return;
sendPayload({type:"text",data:msgIn.value,reply:replyData});
msgIn.value="";
cancelReply();
}

function sendPayload(p){
const enc=CryptoJS.AES.encrypt(JSON.stringify(p),KEY).toString();
db.collection("rooms").doc(ROOM).collection("messages").add({
sender:auth.currentUser.phoneNumber,
text:enc,
seen:[auth.currentUser.phoneNumber],
ts:firebase.firestore.FieldValue.serverTimestamp()
});
}

/* LOAD MESSAGES */
function listenMessages(){
db.collection("rooms").doc(ROOM).collection("messages").orderBy("ts")
.onSnapshot(s=>{
messages.innerHTML="";
s.forEach(d=>{
const m=d.data(),me=auth.currentUser.phoneNumber;
if(!m.seen.includes(me))
d.ref.update({seen:firebase.firestore.FieldValue.arrayUnion(me)});

const dec=JSON.parse(CryptoJS.AES.decrypt(m.text,KEY).toString(CryptoJS.enc.Utf8));
const div=document.createElement("div");
div.className="msg "+(m.sender===me?"sent":"recv");
div.dataset.id=d.id;

if(dec.reply){
const r=document.createElement("div");
r.className="reply-box";
r.textContent=dec.reply.preview;
div.appendChild(r);
}

div.appendChild(document.createTextNode(dec.data));

const tick=document.createElement("div");
tick.className="tick";
tick.textContent=m.seen.length>1?"✓✓":"✓";
div.appendChild(tick);

div.oncontextmenu=e=>{
e.preventDefault();
setReply(dec,d.id);
};

messages.appendChild(div);
});
messages.scrollTop=messages.scrollHeight;
});
}

/* REPLY */
function setReply(dec,id){
replyData={id,preview:dec.data};
replyText.textContent=replyData.preview;
replyPreview.classList.remove("hidden");
}
function cancelReply(){
replyData=null;
replyPreview.classList.add("hidden");
}
</script>
</body>
</html>
