<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexus | Private</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
:root{
--bg:#000;--panel:#111;--border:#222;
--sent:#3797f0;--recv:#262626;
--muted:#aaa;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:#fff;
font-family:-apple-system;height:100vh;overflow:hidden;
}
#chat{
max-width:480px;margin:auto;height:100vh;
display:flex;flex-direction:column;
border-left:1px solid var(--border);
border-right:1px solid var(--border);
}
header{
padding:12px 15px;background:var(--panel);
border-bottom:1px solid var(--border);
font-weight:600;
}
#messages{
flex:1;overflow-y:auto;padding:15px;
display:flex;flex-direction:column;gap:10px;
}
.msg{
max-width:75%;padding:10px 12px;
border-radius:18px;font-size:14px;
word-wrap:break-word;
}
.sent{align-self:flex-end;background:var(--sent)}
.recv{align-self:flex-start;background:var(--recv)}
.reactions{
display:flex;gap:6px;margin-top:4px;font-size:13px;
}
.reaction{
background:rgba(255,255,255,.2);
padding:2px 6px;border-radius:10px;
}
.input-bar{
padding:10px;background:var(--panel);
border-top:1px solid var(--border);
display:flex;gap:8px;align-items:center;
}
input{
flex:1;padding:12px;border-radius:20px;
border:none;background:#1a1a1a;color:#fff;
}
button{
background:none;border:none;color:var(--sent);
font-weight:600;cursor:pointer;
font-size:16px;
}

/* EMOJI PICKER */
#emojiPicker{
position:fixed;bottom:80px;left:50%;
transform:translateX(-50%);
background:#1a1a1a;padding:10px;
border-radius:14px;display:grid;
grid-template-columns:repeat(6,1fr);
gap:8px;z-index:50;
}
#emojiPicker span{
font-size:22px;cursor:pointer;
}
.hidden{display:none}
</style>
</head>

<body>

<div id="chat">
<header>Nexus</header>

<div id="messages"></div>

<div class="input-bar">
<span id="mic">🎤</span>
<input id="msgIn" placeholder="Message…">
<button onclick="sendText()">Send</button>
</div>
</div>

<!-- EMOJI PICKER -->
<div id="emojiPicker" class="hidden"></div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyATZocEXlzKYosr5EDrXWC2llBhlWGCAtE",
authDomain:"nexus-private.firebaseapp.com",
projectId:"nexus-private",
storageBucket:"nexus-private.appspot.com"
});

const db=firebase.firestore();
const storage=firebase.storage();
const KEY="Secretamongus";

const ME="+918480894259";
const HER="+918260368337";
const ROOM=[ME,HER].sort().join("_");

/* TEXT */
function sendText(){
if(!msgIn.value)return;
sendPayload({type:"text",data:msgIn.value});
msgIn.value="";
}

function sendPayload(p){
const enc=CryptoJS.AES.encrypt(JSON.stringify(p),KEY).toString();
db.collection("rooms").doc(ROOM).collection("messages").add({
sender:ME,text:enc,reactions:{},
ts:firebase.firestore.FieldValue.serverTimestamp()
});
}

/* LOAD MESSAGES */
db.collection("rooms").doc(ROOM).collection("messages")
.orderBy("ts").onSnapshot(s=>{
messages.innerHTML="";
s.forEach(d=>{
const m=d.data();
const dec=JSON.parse(CryptoJS.AES.decrypt(m.text,KEY).toString(CryptoJS.enc.Utf8));

const div=document.createElement("div");
div.className="msg "+(m.sender===ME?"sent":"recv");

if(dec.type==="text")div.textContent=dec.data;
if(dec.type==="voice"){
const a=document.createElement("audio");
a.controls=true;a.src=dec.data;
div.appendChild(a);
}

div.oncontextmenu=e=>{
e.preventDefault();
showEmojiPicker(d.ref);
};

const r=document.createElement("div");
r.className="reactions";
Object.entries(m.reactions||{}).forEach(([e,c])=>{
const s=document.createElement("span");
s.className="reaction";
s.textContent=`${e} ${c}`;
r.appendChild(s);
});
div.appendChild(r);

messages.appendChild(div);
});
messages.scrollTop=messages.scrollHeight;
});

/* EMOJI PICKER */
const emojis=["❤️","😂","🔥","😍","👍","😢","😡","👏","😮","🥰","🤍","💯"];
let currentMsgRef=null;

function showEmojiPicker(ref){
currentMsgRef=ref;
emojiPicker.innerHTML="";
emojis.forEach(e=>{
const s=document.createElement("span");
s.textContent=e;
s.onclick=()=>addReaction(e);
emojiPicker.appendChild(s);
});
emojiPicker.classList.remove("hidden");
document.onclick=()=>emojiPicker.classList.add("hidden");
}

function addReaction(e){
currentMsgRef.update({
[`reactions.${e}`]:firebase.firestore.FieldValue.increment(1)
});
emojiPicker.classList.add("hidden");
}

/* VOICE */
let recorder,stream,chunks=[];
mic.onmousedown=async()=>{
stream=await navigator.mediaDevices.getUserMedia({audio:true});
recorder=new MediaRecorder(stream);
chunks=[];
recorder.ondataavailable=e=>chunks.push(e.data);
recorder.onstop=async()=>{
const blob=new Blob(chunks,{type:"audio/webm"});
const ref=storage.ref("voices/"+Date.now()+".webm");
await ref.put(blob);
sendPayload({type:"voice",data:await ref.getDownloadURL()});
};
recorder.start();
};
document.onmouseup=()=>{
if(recorder && recorder.state==="recording") recorder.stop();
};
</script>
</body>
</html>
