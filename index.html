<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexus | Private</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>

<!-- Crypto -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
:root{
  --grad:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  --bg:#000;--border:#262626;--accent:#0095f6;
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;display:flex;justify-content:center;
  background:var(--bg);color:#fff;font-family:-apple-system,system-ui;
}
.hidden{display:none}
.visible{display:flex}

#auth,#chat{
  width:100%;max-width:420px;height:100vh;flex-direction:column;
  border-left:1px solid var(--border);border-right:1px solid var(--border);
}

/* AUTH */
#auth{align-items:center;justify-content:center}
.card{
  width:100%;padding:40px;background:#121212;border-radius:14px;
  border:1px solid var(--border);text-align:center;
}
.logo{
  font-size:30px;font-weight:900;font-style:italic;margin-bottom:30px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
input{
  width:100%;padding:14px;margin-bottom:14px;border-radius:8px;
  border:1px solid var(--border);background:#000;color:#fff;
}
button{
  padding:10px 14px;border-radius:8px;border:none;
  font-weight:700;cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#fff;color:#000}

/* CHAT */
header{
  padding:15px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
#typing{font-size:12px;color:#aaa;padding:6px 15px}

#messages{
  flex:1;padding:16px;display:flex;flex-direction:column;
  gap:8px;overflow-y:auto;
}
.msg{
  max-width:75%;padding:12px 16px;border-radius:22px;
  font-size:14px;
}
.sent{background:var(--accent);align-self:flex-end}
.received{background:#262626;align-self:flex-start}
.msg img{max-width:100%;border-radius:12px}
.meta{font-size:10px;opacity:.7;margin-top:4px;text-align:right}

.input-bar{
  padding:14px;display:flex;gap:8px;border-top:1px solid var(--border);
  align-items:center;
}
#msg{
  flex:1;padding:12px 18px;border-radius:25px;
  border:1px solid #363636;background:#1a1a1a;color:#fff;
}
.icon{cursor:pointer;font-size:18px}
.toggle{
  font-size:12px;padding:6px 10px;border-radius:14px;
  background:#262626;cursor:pointer;
}
.toggle.on{background:#ff3040}
.audio{
  width:220px;
}
.voice{
  padding:10px 14px;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth" class="visible">
  <div class="card">
    <div class="logo">NEXUS</div>
    <div id="recaptcha"></div>
    <input id="phone" placeholder="Your phone (+91…)">
    <button class="primary" onclick="sendOTP()">Get Code</button>
    <input id="otp" placeholder="OTP" class="hidden">
    <button id="verify" class="secondary hidden" onclick="verifyOTP()">Login</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat" class="hidden">
  <header>
    <div class="logo" style="font-size:20px">Nexus</div>
    <div class="toggle" id="vanishBtn" onclick="toggleVanish()">Vanish OFF</div>
  </header>

  <div id="typing"></div>
  <div id="messages"></div>

  <div class="input-bar">
   <span class="icon" onclick="pickImage()">📷</span>
   <input id="msg" placeholder="Message…" oninput="setTyping(true)">
   <span class="icon" id="micBtn">🎙️</span>
   <span class="icon" onclick="sendMessage()">➤</span>
 </div>
</div>

<input type="file" id="imgPicker" accept="image/*" class="hidden">

<script>
/* CONFIG */
firebase.initializeApp({
  apiKey:"AIzaSyATZocEXlzKYosr5EDrXWC2llBhlWGCAtE",
  authDomain:"nexus-private.firebaseapp.com",
  projectId:"nexus-private",
  storageBucket:"nexus-private.appspot.com"
});
const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();
const KEY="Secretamongus";

/* CHANGE THIS */
const OTHER_PHONE="+911234567890";

let vanishMode=false;

/* AUTH */
window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier(
  'recaptcha',{size:'invisible'}
);

async function sendOTP(){
  window.confirmationResult=
    await auth.signInWithPhoneNumber(phone.value,recaptchaVerifier);
  otp.classList.remove("hidden");
  verify.classList.remove("hidden");
}

async function verifyOTP(){
  await confirmationResult.confirm(otp.value);
  auth.classList.add("hidden");
  chat.classList.remove("hidden");
  initChat();
}

/* ROOM */
const roomId=()=>[auth.currentUser.phoneNumber,OTHER_PHONE].sort().join("_");

/* VANISH */
function toggleVanish(){
  vanishMode=!vanishMode;
  vanishBtn.classList.toggle("on",vanishMode);
  vanishBtn.innerText=vanishMode?"Vanish ON":"Vanish OFF";
}

/* CHAT INIT */
function initChat(){
  loadMessages();
  listenTyping();
}

/* SEND TEXT */
function sendMessage(){
  if(!msg.value)return;
  sendPayload({type:"text",data:msg.value});
  msg.value="";
  setTyping(false);
}

/* IMAGE */
function pickImage(){ imgPicker.click(); }
imgPicker.onchange=async()=>{
  const file=imgPicker.files[0];
  if(!file)return;
  const ref=storage.ref(`images/${roomId()}/${Date.now()}`);
  await ref.put(file);
  const url=await ref.getDownloadURL();
  sendPayload({type:"image",data:url});
};

/* SEND CORE */
function sendPayload(payload){
  const enc=CryptoJS.AES.encrypt(
    JSON.stringify(payload),KEY
  ).toString();

  db.collection("rooms").doc(roomId())
    .collection("messages").add({
      sender:auth.currentUser.phoneNumber,
      text:enc,
      seenBy:[auth.currentUser.phoneNumber],
      vanish:vanishMode,
      ts:firebase.firestore.FieldValue.serverTimestamp()
    });
}

/* LOAD */
function loadMessages(){
  db.collection("rooms").doc(roomId())
    .collection("messages").orderBy("ts")
    .onSnapshot(s=>{
      messages.innerHTML="";
      s.forEach(d=>{
        const m=d.data();
        if(!m.seenBy.includes(auth.currentUser.phoneNumber)){
          d.ref.update({seenBy:[...m.seenBy,auth.currentUser.phoneNumber]});
          if(m.vanish && m.sender!==auth.currentUser.phoneNumber)
            setTimeout(()=>d.ref.delete(),3000);
        }

        const payload=JSON.parse(
          CryptoJS.AES.decrypt(m.text,KEY)
            .toString(CryptoJS.enc.Utf8)
        );

        const div=document.createElement("div");
        div.className="msg "+(
          m.sender===auth.currentUser.phoneNumber?"sent":"received"
        );

       if(payload.type==="image"){
         div.innerHTML=`<img src="${payload.data}">`;
}
      else if(payload.type==="voice"){
        div.classList.add("voice");
        div.innerHTML=`
        <audio controls src="${payload.data}"></audio>
  `;
}
      else{
       div.innerHTML=payload.data;
}

        messages.appendChild(div);
      });
      messages.scrollTop=messages.scrollHeight;
    });
}

/* TYPING */
function setTyping(v){
  db.collection("typing").doc(roomId())
    .set({user:auth.currentUser.phoneNumber,typing:v});
}
function listenTyping(){
  db.collection("typing").doc(roomId())
    .onSnapshot(d=>{
      if(!d.exists)return;
      const t=d.data();
      typing.innerText=
        t.typing && t.user!==auth.currentUser.phoneNumber
        ? "Typing…" : "";
    });
}
let recorder;
let audioChunks=[];
let recording=false;

const micBtn=document.getElementById("micBtn");

micBtn.onmousedown = startRecord;
micBtn.onmouseup = stopRecord;
micBtn.ontouchstart = startRecord;
micBtn.ontouchend = stopRecord;

async function startRecord(){
  if(recording) return;
  recording=true;
  micBtn.innerText="⏺️";

  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  recorder = new MediaRecorder(stream);
  audioChunks=[];

  recorder.ondataavailable = e => audioChunks.push(e.data);

  recorder.onstop = async () => {
    const blob = new Blob(audioChunks,{type:"audio/webm"});
    const ref = storage.ref(
      `voice/${roomId()}/${Date.now()}.webm`
    );
    await ref.put(blob);
    const url = await ref.getDownloadURL();

    sendPayload({ type:"voice", data:url });
    micBtn.innerText="🎙️";
    recording=false;
  };

  recorder.start();
}

function stopRecord(){
  if(!recording) return;
  recorder.stop();
}

</script>

</body>
</html>
